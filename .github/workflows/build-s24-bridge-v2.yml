name: Build GPTWake S24 Bridge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform and build-tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply S24 trusted-keyguard bridge patch
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("app/src/main/java/com/desmond/gptwake")
          gpt = root / "GptLauncher.java"
          shim = root / "ShimActivity.java"
          wake = root / "WakeController.java"
          gradle = Path("app/build.gradle.kts")

          gpt.write_text('''package com.desmond.gptwake;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.net.Uri;

          public final class GptLauncher {
              private static final String GPT_PACKAGE = "com.openai.chatgpt";
              private static final String ACTION_VOICE_ASSIST = "android.intent.action.VOICE_ASSIST";

              private static final ComponentName GPT_VOICE_COMPONENT = new ComponentName(
                      GPT_PACKAGE, "com.openai.voice.assistant.AssistantActivity");

              public static boolean launchAssistant(Context context) {
                  if (launchImplicitAssistant(context, ACTION_VOICE_ASSIST, "VOICE_ASSIST")) {
                      return true;
                  }
                  return launchImplicitAssistant(context, Intent.ACTION_ASSIST, "ASSIST");
              }

              private static boolean launchImplicitAssistant(Context context, String action, String tag) {
                  try {
                      Intent assist = new Intent(action)
                              .addCategory(Intent.CATEGORY_DEFAULT)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);

                      ResolveInfo resolved = context.getPackageManager().resolveActivity(
                              assist, PackageManager.MATCH_DEFAULT_ONLY);

                      if (resolved != null && resolved.activityInfo != null) {
                          L.i(tag + "_RESOLVED="
                                  + resolved.activityInfo.packageName + "/"
                                  + resolved.activityInfo.name);
                      } else {
                          L.i(tag + "_RESOLVED=null");
                      }

                      context.startActivity(assist);
                      L.i(tag + "_LAUNCH_OK action=" + action);
                      return true;
                  } catch (Throwable t) {
                      L.e(tag + "_LAUNCH_FAIL", t);
                      return false;
                  }
              }

              public static boolean launchDirect(Context context) {
                  try {
                      PackageManager pm = context.getPackageManager();
                      ActivityInfo info = pm.getActivityInfo(GPT_VOICE_COMPONENT, 0);
                      if (!info.exported) throw new IllegalStateException("AssistantActivity not exported");
                      if (info.permission != null) {
                          throw new IllegalStateException("AssistantActivity needs " + info.permission);
                      }
                      context.startActivity(new Intent()
                              .setComponent(GPT_VOICE_COMPONENT)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                      L.i("DIRECT_LAUNCH_OK");
                      return true;
                  } catch (Throwable t) {
                      L.e("DIRECT_LAUNCH_FAIL", t);
                      return false;
                  }
              }

              public static boolean launchDeeplink(Context context) {
                  try {
                      context.startActivity(new Intent(Intent.ACTION_VIEW,
                              Uri.parse("https://chat.com/?mode=voice"))
                              .setPackage(GPT_PACKAGE)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                      L.i("DEEPLINK_LAUNCH_OK");
                      return true;
                  } catch (Throwable t) {
                      L.e("DEEPLINK_LAUNCH_FAIL", t);
                      return false;
                  }
              }

              public static boolean launch(Context context) {
                  return launchAssistant(context) || launchDeeplink(context);
              }
          }
          '''.replace("          ", ""), encoding="utf-8")

          shim.write_text('''package com.desmond.gptwake;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.ResultReceiver;
          import java.util.concurrent.atomic.AtomicBoolean;

          public class ShimActivity extends Activity {
              public static final String EXTRA_ACTION = "shim_action";
              private static final long DISMISS_WATCHDOG_MS = 2500;

              private final Handler ui = new Handler(Looper.getMainLooper());
              private final AtomicBoolean finished = new AtomicBoolean(false);
              private final AtomicBoolean bridgeResolved = new AtomicBoolean(false);
              private boolean dispatched = false;
              private boolean resumed;

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setShowWhenLocked(true);
                  setTurnScreenOn(true);
                  overridePendingTransition(0, 0);
                  L.i("SHIM_CREATE action=" + getIntent().getStringExtra(EXTRA_ACTION));
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  L.i("SHIM_WINDOW_FOCUS=" + hasFocus);
                  if (hasFocus) dispatch();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  resumed = true;
                  L.i("SHIM_RESUME");
                  ui.postDelayed(this::dispatch, 300);
              }

              private synchronized void dispatch() {
                  if (dispatched || !resumed || isFinishing() || isDestroyed()) return;
                  dispatched = true;

                  String action = getIntent().getStringExtra(EXTRA_ACTION);
                  if ("launch".equals(action)) {
                      launchThroughTrustedKeyguard();
                      return;
                  }

                  ResultReceiver ack = new ResultReceiver(ui) {
                      @Override
                      protected void onReceiveResult(int code, Bundle data) {
                          L.i("SHIM_GOT_ACK code=" + code
                                  + (code == 0 ? " (FGS foreground + AudioRecord recording)" : " (FAILED)"));
                          done(0);
                      }
                  };

                  try {
                      startForegroundService(new Intent(this, WakeService.class)
                              .putExtra(WakeService.EXTRA_ACK, ack));
                      L.i("SHIM_FGS_REQUEST_OK");
                  } catch (Throwable t) {
                      L.e("SHIM_FGS_REQUEST_FAIL", t);
                      done(0);
                      return;
                  }

                  ui.postDelayed(() -> {
                      if (finished.get()) return;
                      L.i("SHIM_ACK_TIMEOUT");
                      done(0);
                  }, 5000);
              }

              private void launchThroughTrustedKeyguard() {
                  KeyguardManager km = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);
                  if (km == null) {
                      L.i("BRIDGE_STATE keyguardManager=null");
                      launchAssistantOnce("no_keyguard_manager");
                      return;
                  }

                  boolean keyguardLocked = km.isKeyguardLocked();
                  boolean deviceLocked = km.isDeviceLocked();
                  boolean deviceSecure = km.isDeviceSecure();
                  L.i("BRIDGE_STARTED keyguardLocked=" + keyguardLocked
                          + " deviceLocked=" + deviceLocked
                          + " deviceSecure=" + deviceSecure);

                  if (!keyguardLocked) {
                      launchAssistantOnce("keyguard_not_showing");
                      return;
                  }

                  if (deviceLocked) {
                      L.i("DISMISS_SKIPPED deviceLocked=true (secure/untrusted)");
                      launchDeeplinkOnce("secure_untrusted_fallback");
                      return;
                  }

                  L.i("DISMISS_REQUESTED trustedCandidate=true");
                  try {
                      km.requestDismissKeyguard(this, new KeyguardManager.KeyguardDismissCallback() {
                          @Override
                          public void onDismissSucceeded() {
                              L.i("DISMISS_SUCCEEDED");
                              ui.postDelayed(() -> launchAssistantOnce("dismiss_succeeded"), 120);
                          }

                          @Override
                          public void onDismissCancelled() {
                              L.i("DISMISS_CANCELLED");
                              launchDeeplinkOnce("dismiss_cancelled");
                          }

                          @Override
                          public void onDismissError() {
                              L.i("DISMISS_ERROR");
                              launchDeeplinkOnce("dismiss_error");
                          }
                      });
                  } catch (Throwable t) {
                      L.e("DISMISS_REQUEST_FAIL", t);
                      launchDeeplinkOnce("dismiss_exception");
                      return;
                  }

                  ui.postDelayed(() -> {
                      if (bridgeResolved.get()) return;
                      L.i("DISMISS_TIMEOUT afterMs=" + DISMISS_WATCHDOG_MS);
                      launchDeeplinkOnce("dismiss_timeout");
                  }, DISMISS_WATCHDOG_MS);
              }

              private void launchAssistantOnce(String reason) {
                  if (!bridgeResolved.compareAndSet(false, true)) return;
                  L.i("BRIDGE_ASSIST_ATTEMPT reason=" + reason);
                  boolean ok = GptLauncher.launchAssistant(this);
                  if (!ok) {
                      L.i("BRIDGE_ASSIST_FALLBACK route=deeplink");
                      ok = GptLauncher.launchDeeplink(this);
                  }
                  L.i("BRIDGE_LAUNCH_RESULT=" + ok);
                  done(800);
              }

              private void launchDeeplinkOnce(String reason) {
                  if (!bridgeResolved.compareAndSet(false, true)) return;
                  L.i("BRIDGE_DEEPLINK_ATTEMPT reason=" + reason);
                  L.i("BRIDGE_LAUNCH_RESULT=" + GptLauncher.launchDeeplink(this));
                  done(800);
              }

              private void done(long delayMs) {
                  if (!finished.compareAndSet(false, true)) return;
                  ui.postDelayed(() -> {
                      L.i("SHIM_FINISH fgs=" + WakeService.isForegroundNow()
                              + " recording=" + AudioProbe.isRunning());
                      finish();
                      overridePendingTransition(0, 0);
                  }, delayMs);
              }

              @Override
              protected void onPause() {
                  resumed = false;
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  ui.removeCallbacksAndMessages(null);
                  super.onDestroy();
              }
          }
          '''.replace("          ", ""), encoding="utf-8")

          txt = wake.read_text(encoding="utf-8")
          if "import android.content.Intent;" not in txt:
              txt = txt.replace("import android.content.Context;\n",
                                "import android.content.Context;\nimport android.content.Intent;\n", 1)

          old = '''        L.i("CHATGPT_LAUNCH_ATTEMPT route=AssistantActivity");
                  GptLauncher.launchDirect(ctx);
                  later(this::checkVoiceConfirm, VOICE_CONFIRM_MS);'''.replace("                  ", "        ")

          new = '''        L.i("CHATGPT_LAUNCH_ATTEMPT route=trusted_keyguard_assist_bridge");
                  try {
                      ctx.startActivity(new Intent(ctx, ShimActivity.class)
                              .putExtra(ShimActivity.EXTRA_ACTION, "launch")
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                                      | Intent.FLAG_ACTIVITY_NO_ANIMATION
                                      | Intent.FLAG_ACTIVITY_CLEAR_TOP));
                      L.i("BRIDGE_ACTIVITY_STARTED");
                  } catch (Throwable t) {
                      L.e("BRIDGE_ACTIVITY_FAIL", t);
                      deeplinkTried = true;
                      GptLauncher.launchDeeplink(ctx);
                  }
                  later(this::checkVoiceConfirm, VOICE_CONFIRM_MS);'''.replace("                  ", "        ")

          if old not in txt:
              raise SystemExit("WakeController launch block changed upstream; refusing to patch wrong code")
          wake.write_text(txt.replace(old, new, 1), encoding="utf-8")

          gt = gradle.read_text(encoding="utf-8")
          needle = '''        debug {
              isMinifyEnabled = false
          }'''.replace("          ", "        ")
          replacement = '''        debug {
              isMinifyEnabled = false
              applicationIdSuffix = ".s24bridge"
              versionNameSuffix = "-s24bridge2"
          }'''.replace("          ", "        ")
          if needle not in gt:
              raise SystemExit("Could not find debug buildType block")
          gradle.write_text(gt.replace(needle, replacement, 1), encoding="utf-8")

          print("S24 Bridge patch applied successfully")
          PY

      - name: Show patched identifiers
        shell: bash
        run: |
          grep -n "applicationIdSuffix\|versionNameSuffix" app/build.gradle.kts
          grep -n "trusted_keyguard_assist_bridge" app/src/main/java/com/desmond/gptwake/WakeController.java
          grep -n "DISMISS_REQUESTED" app/src/main/java/com/desmond/gptwake/ShimActivity.java

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          src="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$src"
          cp "$src" GPTWake-S24-Bridge-debug.apk
          ls -lh GPTWake-S24-Bridge-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: GPTWake-S24-Bridge-debug
          path: GPTWake-S24-Bridge-debug.apk
          if-no-files-found: error
